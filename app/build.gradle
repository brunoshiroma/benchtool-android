import java.time.LocalDateTime

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.diffplug.spotless'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
        implementation = JvmImplementation.J9
    }
}

android {
    compileSdkVersion versions.compileSdkVersion
    buildToolsVersion versions.buildToolsVersion
    ndkVersion versions.ndkVersion

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.brunoshiroma.benchtool_android"
        minSdkVersion versions.minSdkVersion
        targetSdkVersion versions.targetSdkVersion
        versionCode 8000//because multi apk =(
        versionName "0.8.0"

        multiDexEnabled true

        buildConfigField 'String', 'BUILD_YEAR', '"' + LocalDateTime.now().format("yyyy") + '"'
        buildConfigField 'String', 'BUILD_DATE', '"' + LocalDateTime.now().format("yyyyMMdd HH:mm:ss") + '"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testHandleProfiling true
        testFunctionalTest true


        ndk {
            // Specifies the ABI configurations of your native
            // libraries Gradle should build and package with your APK.
            //
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            packagingOptions {
                doNotStrip "**/*.so"
            }
        }

    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
        }
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    dynamicFeatures = [':benchtool_rust']
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    namespace 'com.brunoshiroma.benchtool_android'
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation(platform("androidx.compose:compose-bom:2025.10.00"))

    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$versions.kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation 'com.google.android.material:material:1.13.0'

    implementation 'com.google.android.gms:play-services-ads:24.7.0'
    implementation 'com.google.android.play:feature-delivery:2.1.0'

    implementation 'net.java.dev.jna:jna:5.18.1@aar'


    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.test.espresso:espresso-idling-resource:3.7.0'

    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("androidx.compose.ui:ui-tooling-preview")

    implementation 'com.android.support:multidex:1.0.3'

    implementation 'com.brunoshiroma:benchtool-java:0.1.0-SNAPSHOT-20220806_210000_1'
    implementation 'androidx.navigation:navigation-runtime-ktx:2.9.5'
    implementation 'androidx.navigation:navigation-compose:2.9.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

}



spotless {
    kotlin {
        target("**/*.kt")
        ktlint("1.7.1")
        suppressLintsFor {
            step = "ktlint"
            shortCode = "standard:package-name"
        }
    }
    kotlinGradle {
        target("*.gradle.kts", "additionalScripts/*.gradle.kts")
        ktlint("1.7.1")
    }
}